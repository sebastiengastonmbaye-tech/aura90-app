<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d2b22">
<title>Apple of Fortune 90</title>
<link rel="manifest" href="manifest.json">
<style>
/* ============================================================
   APPLE OF FORTUNE 90 — feuille de style unique
   Pour remplacer le décor par ton image : voir --bg-image plus bas
   ============================================================ */

:root{
  --vert-fond:      #123a2c;
  --vert-fond-2:    #0a2119;
  --vert-clair:     #2f7d4f;
  --vert-actif:     #5cc46b;
  --pastille:       rgba(12,26,20,.82);
  --bois-haut:      #e09a55;
  --bois-bas:       #8a4620;
  --bois-actif-h:   #f7c073;
  --bois-actif-b:   #b8722a;
  --rouge-pomme:    #d8262c;
  --rouge-sombre:   #8f1a1f;
  --texte:          #ffffff;
  --texte-faible:   rgba(255,255,255,.62);

  /* ==========================================================
     TES IMAGES — dépose tes PNG dans un dossier assets/
     Tant qu'un fichier est absent, le dessin CSS s'affiche
     à la place. Rien d'autre à modifier.
     ========================================================== */
  --img-fond:      url('aof90-fond.png');            /* décor jungle */
  --img-case:      url('aof90-case.png');            /* disque en bois */
  --img-case-active: url('aof90-case-active.png');   /* disque ligne active */
  --img-gagnante:  url('aof90-case-gagnante.png');   /* disque vert + pomme */
  --img-perdante:  url('aof90-case-perdante.png');   /* disque rouge + trognon */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}

body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  color:var(--texte);
  background:
    var(--img-fond) center/cover no-repeat,
    radial-gradient(120% 70% at 50% 0%,  #1d5040 0%, var(--vert-fond) 45%, var(--vert-fond-2) 100%);
  display:flex;
  justify-content:center;
  overflow:hidden;
}

.app{
  width:100%;
  max-width:430px;
  height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

/* ---------- En-tête ---------- */
.entete{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  padding:14px 56px 6px;
  position:relative;
}
.titre{
  font-size:16px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  text-align:center;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}
.badge-sim{
  font-size:9px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  padding:4px 10px;
  border-radius:20px;
  color:#ffd400;
  border:1px solid rgba(255,212,0,.5);
  background:rgba(0,0,0,.35);
}
.btn-info{
  position:absolute;
  right:16px;
  top:34px;
  width:30px;height:30px;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,.55);
  background:rgba(0,0,0,.25);
  color:#fff;
  font:italic 700 15px Georgia,serif;
  cursor:pointer;
}

/* ---------- Compteur de séries ---------- */
.compteur{
  flex:0 0 auto;
  text-align:center;
  font-size:11px;
  letter-spacing:.06em;
  color:var(--texte-faible);
  padding-bottom:6px;
}
.compteur b{color:#ffd400}
.enjeu{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11px;font-weight:800;letter-spacing:.14em;
  color:#7fe38f;text-transform:uppercase;
}
.enjeu .point{
  width:8px;height:8px;border-radius:50%;
  background:#4fe06a;
  box-shadow:0 0 8px #4fe06a;
  animation:pulser 1.1s ease-in-out infinite;
}
@keyframes pulser{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.72)}
}

/* ---------- Grille ---------- */
.zone-grille{
  flex:1 1 auto;
  overflow:hidden;
  position:relative;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 88%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 88%,transparent 100%);
}
.grille{
  position:absolute;
  left:0;right:0;
  transition:transform .55s cubic-bezier(.22,.8,.3,1);
  padding:8px 12px;
}

.ligne{
  display:grid;
  grid-template-columns:64px repeat(5,1fr);
  align-items:center;
  gap:6px;
  margin-bottom:6px;
  opacity:.5;
  transition:opacity .4s ease;
}
.ligne.jouable,
.ligne.jouee{opacity:1}

.cote{
  justify-self:start;
  min-width:60px;
  text-align:center;
  font-size:12px;
  font-weight:600;
  padding:6px 8px;
  border-radius:16px;
  background:var(--pastille);
  color:#fff;
  white-space:nowrap;
}
.ligne.active .cote{
  background:var(--vert-actif);
  color:#0b2a18;
  font-weight:700;
  box-shadow:0 0 14px rgba(92,196,107,.55);
}

/* ---------- Disques ---------- */
.case{
  position:relative;
  aspect-ratio:1/1;
  border-radius:50%;
  background:
    var(--img-case) center/cover no-repeat,
    repeating-linear-gradient(180deg,rgba(0,0,0,.10) 0 2px,transparent 2px 7px),
    radial-gradient(circle at 34% 24%,var(--bois-haut) 0%,#b96a30 55%,var(--bois-bas) 100%);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.ligne.active .case{
  background:
    var(--img-case-active) center/cover no-repeat,
    repeating-linear-gradient(180deg,rgba(0,0,0,.10) 0 2px,transparent 2px 7px),
    radial-gradient(circle at 34% 24%,var(--bois-actif-h) 0%,#e09a4b 55%,var(--bois-actif-b) 100%);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.3),0 0 16px rgba(247,192,115,.35);
}

.case.revelee{animation:retourner .42s ease both}
@keyframes retourner{
  0%{transform:rotateY(0)}
  50%{transform:rotateY(90deg)}
  100%{transform:rotateY(0)}
}
.case.saine, .ligne.active .case.saine{
  background:
    var(--img-gagnante) center/cover no-repeat,
    repeating-linear-gradient(180deg,rgba(0,0,0,.10) 0 2px,transparent 2px 7px),
    radial-gradient(circle at 34% 24%,#5fbf6e 0%,#2f8a45 60%,#175a2a 100%);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.3),0 0 18px rgba(95,191,110,.4);
}
.case.pourrie, .ligne.active .case.pourrie{
  background:
    var(--img-perdante) center/cover no-repeat,
    repeating-linear-gradient(180deg,rgba(0,0,0,.12) 0 2px,transparent 2px 7px),
    radial-gradient(circle at 34% 24%,#b8443f 0%,#8e2b26 60%,#5d1a17 100%);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.4),0 0 18px rgba(184,68,63,.35);
}
.case svg{width:66%;height:66%;display:block}

/* ---------- Pied ---------- */
.pied{
  flex:0 0 auto;
  padding:12px 20px 20px;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:center;
}
.message{
  min-height:20px;
  font-size:13px;
  letter-spacing:.02em;
  text-align:center;
  text-shadow:0 2px 6px rgba(0,0,0,.6);
}
.message.gagne{color:#7fe38f;font-weight:700}
.message.perdu{color:#ff8b86;font-weight:700}

.btn-action{
  width:100%;
  max-width:300px;
  padding:16px;
  border:none;
  border-radius:32px;
  font-size:16px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#0b2a18;
  background:linear-gradient(180deg,#8ce39a,#3fa259);
  box-shadow:0 5px 0 #256b39,0 10px 22px rgba(0,0,0,.4);
  cursor:pointer;
  transition:transform .1s ease,box-shadow .1s ease,filter .2s ease;
}
.btn-action:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #256b39,0 5px 14px rgba(0,0,0,.4)}
.btn-action:disabled{filter:grayscale(.7) brightness(.75);cursor:not-allowed}
.btn-action:focus-visible{outline:3px solid #ffd400;outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="app">
  <header class="entete">
    <span class="badge-sim">Simulation</span>
    <span class="titre">Apple of Fortune 90</span>
  </header>

  <div class="compteur" id="compteur"></div>

  <div class="zone-grille">
    <div class="grille" id="grille"></div>
  </div>

  <footer class="pied">
    <div class="message" id="message"></div>
    <button class="btn-action" id="btnAction">Let's go</button>
  </footer>

</div>

<script>

/* ================= GARDE VIP AURA90 =================
   Le jeu est un bonus réservé aux abonnés PRO.
   On lit la session AURA90 (même localStorage) et on
   revalide le statut auprès de Supabase à chaque ouverture. */
const AURA = {
  URL: "https://nzsvmqyiukxzsfjprpiy.supabase.co",
  KEY: "sb_publishable_awuEoyd5PGtUz_bKUfeEWA_M1OPhBoW"
};

function ecranVerrou(msg){
  document.body.innerHTML = `
  <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;font-family:'Segoe UI',system-ui,sans-serif;background:#0a2119;color:#fff">
    <div style="font-size:40px">🔒</div>
    <div style="font-size:17px;font-weight:800;letter-spacing:.04em">Apple of Fortune 90</div>
    <div style="font-size:13px;color:rgba(255,255,255,.65);max-width:280px;line-height:1.6">${msg}</div>
    <a href="./" style="margin-top:8px;padding:14px 28px;border-radius:30px;background:linear-gradient(135deg,#3DE8C8,#8B7CFF);color:#06110E;font-weight:800;text-decoration:none;font-size:14px">Retour à AURA90</a>
  </div>`;
}

async function verifierAcces(){
  let session = null;
  try{ session = JSON.parse(localStorage.getItem('aura90_session') || 'null'); }catch(e){}
  if(!session || !session.access){
    ecranVerrou("Ce jeu est un bonus réservé aux abonnés PRO d'AURA90. Connecte-toi dans l'app pour y accéder.");
    return false;
  }
  try{
    const r = await fetch(AURA.URL + '/rest/v1/abonnes?select=actif_jusqua', {
      headers:{ apikey: AURA.KEY, Authorization: 'Bearer ' + session.access }
    });
    if(r.ok){
      const rows = await r.json();
      const fin = rows[0]?.actif_jusqua;
      if(fin && new Date(fin) > new Date()) return true;
      ecranVerrou("Ton abonnement PRO n'est pas actif. Abonne-toi dans AURA90 pour débloquer le jeu.");
      return false;
    }
    // jeton expiré : on retombe sur le statut stocké par l'app
    if(session.fin && new Date(session.fin) > new Date()) return true;
    ecranVerrou("Session expirée — rouvre AURA90 pour te reconnecter, puis reviens.");
    return false;
  }catch(e){
    // hors ligne : on fait confiance au statut stocké par l'app
    if(session.fin && new Date(session.fin) > new Date()) return true;
    ecranVerrou("Connexion impossible pour vérifier ton abonnement. Réessaie en ligne.");
    return false;
  }
}

/* ============================================================
   CONFIGURATION — tout se règle ici
   ============================================================ */
const LIGNES = [
  { cote:'x 1.23',   saines:4 },
  { cote:'x 1.54',   saines:4 },
  { cote:'x 1.93',   saines:4 },
  { cote:'x 2.41',   saines:4 },
  { cote:'x 4.02',   saines:3 },
  { cote:'x 6.71',   saines:3 },
  { cote:'x 11.18',  saines:3 },
  { cote:'x 27.97',  saines:2 },
  { cote:'x 69.93',  saines:2 },
  { cote:'x 349.68', saines:1 }
];
/* La simulation s'arrête ici ; les lignes au-dessus restent visibles en décor */
const LIGNES_JOUABLES = 4;
const CASES_PAR_LIGNE = 5;
const SERIES_MAX      = 3;
const ATTENTE_MS      = 2 * 60 * 60 * 1000;   // 2 heures

/* Passe à true une fois tes PNG déposés dans assets/ :
   les dessins CSS sont alors désactivés, seules tes images s'affichent. */
const UTILISER_MES_IMAGES = true;

/* MODE TEST : true = séries illimitées, pas de compte à rebours de 2 h.
   >>> Remets false avant le lancement public. <<< */
const MODE_TEST = false;

/* ============================================================
   STOCKAGE — localStorage, avec repli en mémoire si indisponible
   ============================================================ */
const Store = (() => {
  const memoire = {};
  let dispo = false;
  try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); dispo = true; } catch(e){}
  return {
    lire:  k => { try { return dispo ? localStorage.getItem(k) : memoire[k] ?? null; } catch(e){ return memoire[k] ?? null; } },
    ecrire:(k,v) => { memoire[k]=String(v); try { if(dispo) localStorage.setItem(k,String(v)); } catch(e){} }
  };
})();

/* ============================================================
   ÉTAT
   ============================================================ */
let ligneCourante = 0;
let morsures      = 0;
let enCours       = false;
let verrouille    = false;
let minuteur      = null;

const $grille    = document.getElementById('grille');
const $btn       = document.getElementById('btnAction');
const $message   = document.getElementById('message');
const $compteur  = document.getElementById('compteur');

const seriesRestantes = () => {
  const v = parseInt(Store.lire('aof90_series'), 10);
  return Number.isInteger(v) ? v : SERIES_MAX;
};
const finAttente = () => parseInt(Store.lire('aof90_attente'), 10) || 0;

/* ============================================================
   PICTOGRAMMES
   ============================================================ */
const POMME_ENTIERE = `
<svg viewBox="0 0 48 48" aria-hidden="true">
  <path d="M24 12c-3-4-9-5-12-2s-2 10 1 15 8 12 11 12 8-7 11-12 4-12 1-15-9-2-12 2z" fill="#d8262c"/>
  <path d="M24 12c-3-4-9-5-12-2s-2 10 1 15c2 3 4 7 6 9-2-6-3-14 5-22z" fill="#f2554f" opacity=".55"/>
  <path d="M24 12V6" stroke="#6b3f1d" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M25 8c4-5 10-4 10-4s-1 7-7 7c-2 0-3-1-3-3z" fill="#4caf50"/>
</svg>`;

const POMME_MACHEE = `
<svg viewBox="0 0 48 48" aria-hidden="true">
  <path d="M24 8V3" stroke="#6b4a1d" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M16 14c-2 6 4 8 5 12 1 5-6 7-5 12 1 4 6 6 8 6s7-2 8-6c1-5-6-7-5-12 1-4 7-6 5-12z" fill="#f4e6bc"/>
  <path d="M14 13c2-4 6-6 10-6s8 2 10 6c-2 4-4 2-6 4-2 2-4-2-6 0-2 2-4-2-8-4z" fill="#c31f26"/>
  <path d="M17 39c2 4 5 6 7 6s5-2 7-6c-3 2-5 1-7 2-2 1-4 0-7-2z" fill="#c31f26"/>
  <ellipse cx="22" cy="24" rx="1.1" ry="1.7" fill="#fff" opacity=".75"/>
  <ellipse cx="26" cy="30" rx="1.1" ry="1.7" fill="#fff" opacity=".75"/>
  <ellipse cx="23" cy="35" rx="1"   ry="1.5" fill="#fff" opacity=".6"/>
</svg>`;

/* ============================================================
   CONSTRUCTION DE LA GRILLE
   ============================================================ */
function construireGrille(){
  $grille.innerHTML = '';
  // affichage du haut vers le bas : plus gros multiplicateur en premier
  for(let i = LIGNES.length - 1; i >= 0; i--){
    const ligne = document.createElement('div');
    ligne.className = 'ligne';
    ligne.dataset.index = i;

    const cote = document.createElement('div');
    cote.className = 'cote';
    cote.textContent = LIGNES[i].cote;
    ligne.appendChild(cote);

    for(let c = 0; c < CASES_PAR_LIGNE; c++){
      const cellule = document.createElement('div');
      cellule.className = 'case';
      ligne.appendChild(cellule);
    }
    $grille.appendChild(ligne);
  }
}

function rafraichirGrille(){
  document.querySelectorAll('.ligne').forEach(ligne => {
    const i = +ligne.dataset.index;
    ligne.classList.toggle('active',   i === ligneCourante && enCours);
    ligne.classList.toggle('jouable',  i <= ligneCourante);
    ligne.classList.toggle('jouee',    i <  ligneCourante);
  });
  // fait défiler la grille pour garder la ligne active dans le cadre
  const ligneActive = document.querySelector(`.ligne[data-index="${ligneCourante}"]`);
  if(ligneActive){
    const zone = document.querySelector('.zone-grille');
    const decalage = zone.clientHeight * 0.62 - ligneActive.offsetTop - ligneActive.offsetHeight / 2;
    $grille.style.transform = `translateY(${decalage}px)`;
  }
}

/* ============================================================
   DÉROULÉ D'UNE SÉRIE
   ============================================================ */
function jouerLigne(){
  const ligne = document.querySelector(`.ligne[data-index="${ligneCourante}"]`);
  const cases = [...ligne.querySelectorAll('.case')];
  const position = Math.floor(Math.random() * cases.length);

  // tirage honnête : 4 chances sur 5 d'obtenir une pomme entière
  const saine = Math.random() < LIGNES[ligneCourante].saines / 5;

  const cellule = cases[position];
  cellule.classList.add('revelee', saine ? 'saine' : 'pourrie');
  if(!UTILISER_MES_IMAGES){
    cellule.innerHTML = saine ? POMME_ENTIERE : POMME_MACHEE;
  }

  $btn.disabled = true;
  if(!saine) morsures++;

  setTimeout(() => {
    ligneCourante++;
    if(ligneCourante >= LIGNES_JOUABLES){ terminerSerie(); return; }

    rafraichirGrille();
    $btn.disabled  = false;
    $btn.textContent = `Ligne ${ligneCourante + 1}`;
    if(saine){
      $message.className = 'message';
      $message.textContent = `Pomme entière — ${LIGNES[ligneCourante - 1].cote}`;
    } else {
      $message.className = 'message perdu';
      $message.textContent = 'Pomme croquée sur cette ligne !';
    }
  }, 520);
}

function terminerSerie(){
  enCours = false;
  const parfait = morsures === 0;

  $message.className = 'message ' + (parfait ? 'gagne' : 'perdu');
  $message.textContent = parfait
    ? `Série parfaite ! ${LIGNES[LIGNES_JOUABLES - 1].cote}`
    : `Série terminée — ${morsures} pomme${morsures > 1 ? 's' : ''} croquée${morsures > 1 ? 's' : ''} en route`;

  if(MODE_TEST){
    $btn.disabled = false;
    $btn.textContent = 'Rejouer';
    majCompteur();
    return;
  }

  const restantes = seriesRestantes() - 1;
  Store.ecrire('aof90_series', restantes);

  if(restantes <= 0){
    Store.ecrire('aof90_attente', Date.now() + ATTENTE_MS);
    verrouiller();
  } else {
    $btn.disabled = false;
    $btn.textContent = 'Rejouer';
  }
  majCompteur();
}

/* ============================================================
   VERROU DE 2 HEURES
   ============================================================ */
function verrouiller(){
  verrouille = true;
  $btn.disabled = true;
  clearInterval(minuteur);
  minuteur = setInterval(majCompteur, 1000);
  majCompteur();
}

function deverrouiller(){
  verrouille = false;
  clearInterval(minuteur);
  Store.ecrire('aof90_series', SERIES_MAX);
  Store.ecrire('aof90_attente', 0);
  $btn.disabled = false;
  $btn.textContent = "Let's go";
  $message.className = 'message';
  $message.textContent = '';
  majCompteur();
}

function majCompteur(){
  if(verrouille){
    const reste = finAttente() - Date.now();
    if(reste <= 0){ deverrouiller(); return; }
    const h = Math.floor(reste / 3600000);
    const m = Math.floor(reste % 3600000 / 60000);
    const s = Math.floor(reste % 60000 / 1000);
    const deuxChiffres = n => String(n).padStart(2, '0');
    $btn.textContent = `${deuxChiffres(h)}:${deuxChiffres(m)}:${deuxChiffres(s)}`;
    $compteur.innerHTML = 'Séries épuisées — retour dans';
  } else if(enCours){
    $compteur.innerHTML = '<span class="enjeu"><span class="point"></span>En jeu</span>';
  } else if(MODE_TEST){
    $compteur.innerHTML = '&nbsp;';
  } else {
    $compteur.innerHTML = `Séries restantes : <b>${seriesRestantes()}</b> / ${SERIES_MAX}`;
  }
}

/* ============================================================
   ACTION DU BOUTON
   ============================================================ */
$btn.addEventListener('click', () => {
  if(verrouille) return;

  if(!enCours){
    if(!MODE_TEST && seriesRestantes() <= 0){ verrouiller(); return; }
    ligneCourante = 0;
    morsures = 0;
    enCours = true;
    construireGrille();
    rafraichirGrille();
    majCompteur();
    $message.className = 'message';
    $message.textContent = '';
    $btn.textContent = 'Ligne 1';
    // le premier appui lance directement la ligne 1
    jouerLigne();
    return;
  }
  jouerLigne();
});

/* ---------- Démarrage ---------- */
verifierAcces().then(ok => {
  if(!ok) return;
  construireGrille();
  rafraichirGrille();
  if(!MODE_TEST && finAttente() > Date.now()) verrouiller(); else majCompteur();
  window.addEventListener('resize', rafraichirGrille);
});

</script>
</body>
</html>
